version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: receiptrag_postgres
    environment:
      POSTGRES_USER: receipt_user
      POSTGRES_PASSWORD: receipt_pass
      POSTGRES_DB: receiptrag_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: receiptrag_backend
    environment:
      - DATABASE_URL=postgresql://receipt_user:receipt_pass@postgres:5432/receiptrag_db
      - SECRET_KEY=receiptrag_docker_secret_key
      - VECTOR_DB_DIR=/app/chroma_db
      - UPLOAD_DIR=/app/uploads
    ports:
      - "8000:7860"
    depends_on:
      - postgres
    volumes:
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: receiptrag_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
